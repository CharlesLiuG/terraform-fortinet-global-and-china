{{- if eq .Values.ingress.className "alb" }}
{{- if not (lookup "networking.k8s.io/v1" "IngressClass" "" "alb") }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: ingress.k8s.alibabacloud/alb
  parameters:
    apiGroup: alibabacloud.com
    kind: AlbConfig
    name: alb
{{- end }}
{{- end }}
